[package]
name = "mitory"
version = "0.2.0"
description = "Mitory: Story Builder — Local-first visual novel and interactive narrative studio"
authors = ["Mitory Team"]
edition = "2021"

[lib]
name = "mitory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
